spring.application.name=product-mart-demo
server.port=8090

# actuator for circuit breaker - to check the status of the CB - OPEN, HALF-OPEN, CLOSE
# health of the application
management.endpoints.web.exposure.include=health, circuitbreakers
# shows the details always
management.endpoint.health.show-details=always
# circuit breaker properties will be avaiable to view
management.health.circuitbreakers.enabled=true
# Add the default global indicator property (crucial for Spring Cloud starter)
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true

# Update your specific instance property to camelCase
resilience4j.circuitbreaker.instances.findPort.registerHealthIndicator=true
#properties for circuit breaker
# register the health indicator so that actuator allows you to see them
resilience4j.circuitbreaker.instances.findPort.register-health-indicator=true
# cricuit breaker threashold is set to 50% - means if 50% failure rates CB goes to OPEN state
resilience4j.circuitbreaker.instances.findPort.failure-rate-threshold=50
# how long cricuit breaker can stay in half open - set to 0
resilience4j.circuitbreaker.instances.findPort.max-wait-duration-in-half-open-state=0s
# automatically transitions from open to half opeen in 60s 
resilience4j.circuitbreaker.instances.findPort.automatic-transition-from-open-to-half-open-enabled=true
# size of the buffer - ring bit buffer
resilience4j.circuitbreaker.instances.findPort.event-consumer-buffer-size=10
# how many calls to test in half open state
resilience4j.circuitbreaker.instances.findPort.permitted-number-of-calls-in-half-open-state=3
# how many minimum calls before evaluating the buffer
resilience4j.circuitbreaker.instances.findPort.minimum-number-of-calls=5


